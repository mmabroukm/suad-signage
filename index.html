<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SUAD Library Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f0e8;
            color: #24242e;
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #002376;
            color: #fffffc;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #de3831;
        }
        h1 { margin: 0; font-size: 1.8rem; }
        p { margin: 5px 0 0 0; font-size: 0.95rem; color: #ebe0d6; }
        .clock { font-size: 2rem; font-weight: bold; font-family: monospace; }
        .content {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
        }
        h2 { color: #002376; margin-top: 0; font-size: 1.3rem; border-left: 6px solid #de3831; padding-left: 10px; margin-bottom: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #002376;
        }
        .card.today { border-left-color: #de3831; background: #fff5f5; }
        .badge { font-size: 0.8rem; font-weight: bold; color: #002376; background: #eef3fc; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .card h3 { margin: 0 0 8px 0; font-size: 0.95rem; color: #031230; line-height: 1.3; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: #575973; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; }
        footer {
            background-color: #031230;
            color: white;
            padding: 12px 20px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>SUAD Library Events & Training</h1>
            <p>Sorbonne University Abu Dhabi — October 2026 Schedule</p>
        </div>
        <div class="clock" id="clock">00:00:00</div>
    </header>
    <div class="content">
        <h2>Upcoming Workshops & Sessions</h2>
        <div class="grid" id="grid"></div>
    </div>
    <footer>
        Welcome to the SUAD Library! Please register for workshops via LibCal. Silence mobile phones in study areas.
    </footer>
    <script>
        function updateClock() {
            var now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        var events = [
            {date: "2026-10-07", time: "14:30 - 15:30", title: "Discover Notebook Gemini", presenter: "Library Staff", location: "Meeting Room"},
            {date: "2026-10-12", time: "12:00 - 13:00", title: "Evaluating Information Sources", presenter: "Abdelaziz Galal", location: "Meeting Room"},
            {date: "2026-10-12", time: "13:00 - 14:00", title: "AI Conversational Searching Interface", presenter: "Yosra Awara", location: "Online / TBA"},
            {date: "2026-10-13", time: "16:00 - 17:00", title: "Library Resources in Art (Undergrad)", presenter: "Marie Gibon", location: "Meeting Room"},
            {date: "2026-10-14", time: "03:00 - 04:00", title: "Library Resources in Art (Postgrad)", presenter: "Marie Gibon", location: "Meeting Room"},
            {date: "2026-10-14", time: "10:00 - 11:30", title: "Research Communication Lab 9", presenter: "Taylor & Francis", location: "Online / TBA"},
            {date: "2026-10-20", time: "14:30 - 15:30", title: "Discover CAIRN database", presenter: "Nabil Derrough", location: "Online / TBA"},
            {date: "2026-10-21", time: "15:00 - 16:00", title: "Evaluating Information Sources", presenter: "Abdelaziz Galal", location: "Meeting Room"},
            {date: "2026-10-22", time: "14:30 - 15:30", title: "Discover Notebook Gemini", presenter: "Nabil Derrough", location: "Meeting Room"},
            {date: "2026-10-26", time: "12:00 - 13:00", title: "General Vs. Subject Databases", presenter: "Abdelaziz Galal", location: "Meeting Room"},
            {date: "2026-10-26", time: "13:45 - 14:45", title: "EBSCO: AI in Academic Research", presenter: "Yosra Awara", location: "Online / TBA"},
            {date: "2026-10-27", time: "14:30 - 15:30", title: "Discover CAIRN database", presenter: "Nabil Derrough", location: "Online / TBA"},
            {date: "2026-10-28", time: "15:00 - 16:00", title: "General Vs. Subject Databases", presenter: "Abdelaziz Galal", location: "Meeting Room"}
        ];

        var grid = document.getElementById('grid');
        var today = "2026-10-05";
        events.forEach(function(ev) {
            var isToday = (ev.date === today);
            var div = document.createElement('div');
            div.className = 'card' + (isToday ? ' today' : '');
            div.innerHTML = '<div class="badge">' + ev.date + ' | ' + ev.time + '</div>' +
                            '<h3>' + ev.title + '</h3>' +
                            '<div class="card-footer"><span>👤 ' + ev.presenter + '</span><span>📍 ' + ev.location + '</span></div>';
            grid.appendChild(div);
        });
    </script>
</body>
</html>
